<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ocorrências Acadêmicas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
    .tela { display: none; }
    .tela.ativa { display: block; }
    #tela-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #fff; padding: 2rem; border-radius: 8px; width: 340px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .login-box h1 { font-size: 1.4rem; margin-bottom: 0.25rem; color: #1a237e; }
    .subtitulo { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }
    .campo { margin-bottom: 1rem; }
    .campo label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #555; }
    .campo input, .campo select, .campo textarea { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    button { padding: 0.6rem 1.2rem; background: #1a237e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #283593; }
    .erro { color: red; font-size: 0.85rem; margin-top: 0.5rem; }
    header { background: #1a237e; color: #fff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header h2 { font-size: 1rem; }
    .btn-logout { background: rgba(255,255,255,0.2); font-size: 0.8rem; padding: 0.4rem 0.8rem; }
    nav { background: #fff; border-bottom: 1px solid #ddd; padding: 0 1rem; display: flex; gap: 0.25rem; }
    nav button { background: none; color: #333; border: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 0.75rem 1rem; font-size: 0.85rem; }
    nav button.ativo { border-bottom-color: #1a237e; color: #1a237e; font-weight: bold; }
    .aba { display: none; padding: 1.5rem; }
    .aba.ativa { display: block; }
    .aba h3 { margin-bottom: 1rem; color: #1a237e; }
    .card-ocorrencia { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 0.75rem; }
    .card-ocorrencia .titulo { font-weight: bold; margin-bottom: 0.3rem; }
    .card-ocorrencia .detalhe { font-size: 0.82rem; color: #555; }
    .gravidade-baixa { border-left: 4px solid #4caf50; }
    .gravidade-media { border-left: 4px solid #ff9800; }
    .gravidade-alta { border-left: 4px solid #f44336; }
    .gravidade-critica { border-left: 4px solid #880000; background: #fff5f5; }
    .log-item { font-size: 0.8rem; padding: 0.4rem; border-bottom: 1px solid #eee; font-family: monospace; }
    .card-usuario { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; gap: 1rem; align-items: center; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .badge-admin { background: #1a237e; color: #fff; }
    .badge-professor { background: #0288d1; color: #fff; }
    .badge-aluno { background: #388e3c; color: #fff; }
    .msg-sucesso { color: green; font-size: 0.85rem; margin-top: 0.5rem; }
    .msg-erro { color: red; font-size: 0.85rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
<div id="tela-login" class="tela ativa">
  <div class="login-box">
    <h1>Sistema de Ocorrências</h1>
    <p class="subtitulo">Instituição Educacional</p>
    <div class="campo"><label>Usuário</label><input type="text" id="login-usuario" placeholder="Digite seu usuário"></div>
    <div class="campo">
      <!-- Mostrar senha conforme solicitado pelo usuário -->
      <label>Senha</label><input type="text" id="login-senha" placeholder="Digite sua senha">
    </div>
    <button onclick="fazerLogin()">Entrar</button>
    <p id="login-erro" class="erro" style="display:none">Usuário ou senha inválidos.</p>
  </div>
</div>
<div id="tela-principal" class="tela">
  <header>
    <div><h2>Sistema de Ocorrências Acadêmicas</h2><span id="info-usuario-logado"></span></div>
    <button onclick="fazerLogout()" class="btn-logout">Sair</button>
  </header>
  <nav>
    <button onclick="mostrarAba('aba-ocorrencias',event)" class="ativo">Ocorrências</button>
    <button onclick="mostrarAba('aba-cadastro',event)">Cadastrar</button>
    <button onclick="mostrarAba('aba-usuarios',event)">Usuários</button>
    <button onclick="mostrarAba('aba-logs',event)">Logs</button>
    <button onclick="mostrarAba('aba-exportar',event)">Exportar</button>
  </nav>
  <div id="aba-ocorrencias" class="aba ativa"><h3>Ocorrências Registradas</h3><div id="lista-ocorrencias"></div></div>
  <div id="aba-cadastro" class="aba">
    <h3>Cadastrar Nova Ocorrência</h3>
    <div class="campo"><label>Nome do Aluno</label><input type="text" id="ocorr-aluno" placeholder="Nome completo"></div>
    <div class="campo"><label>CPF</label><input type="text" id="ocorr-cpf" placeholder="000.000.000-00"></div>
    <div class="campo"><label>Matrícula</label><input type="text" id="ocorr-matricula" placeholder="Número de matrícula"></div>
    <div class="campo"><label>Turma</label><input type="text" id="ocorr-turma" placeholder="Ex: ES-3A"></div>
    <div class="campo"><label>Tipo</label>
      <select id="ocorr-tipo">
        <option value="disciplinar">Disciplinar</option><option value="academica">Acadêmica</option>
        <option value="administrativa">Administrativa</option><option value="saude">Saúde</option>
        <option value="familiar">Situação Familiar</option>
      </select>
    </div>
    <div class="campo"><label>Descrição</label><textarea id="ocorr-descricao" rows="4"></textarea></div>
    <div class="campo"><label>Gravidade</label>
      <select id="ocorr-gravidade">
        <option value="baixa">Baixa</option><option value="media">Média</option>
        <option value="alta">Alta</option><option value="critica">Crítica</option>
      </select>
    </div>
    <button onclick="cadastrarOcorrencia()">Salvar Ocorrência</button>
    <p id="cadastro-msg" style="display:none"></p>
  </div>
  <div id="aba-usuarios" class="aba"><h3>Perfis de Usuário</h3><div id="lista-usuarios"></div></div>
  <div id="aba-logs" class="aba">
    <h3>Log de Ações</h3>
    <button onclick="limparLogs()" style="margin-bottom:1rem;background:#c62828;">Limpar Logs</button>
    <div id="lista-logs"></div>
  </div>
  <div id="aba-exportar" class="aba">
    <h3>Exportar Dados</h3>
    <p style="margin-bottom:1rem;color:#555;">Exporte todos os registros do sistema.</p>
    <button onclick="exportarDados()" style="margin-right:0.5rem;">Exportar JSON</button>
    <button onclick="exportarCSV()">Exportar CSV</button>
  </div>
</div>
<script>
// VULNERABILIDADE 1: credenciais hardcoded no front-end
var usuarios = [
  { id:1, usuario:"admin",     senha:"admin123",  nome:"Administrador",    perfil:"admin" },
  { id:2, usuario:"professor", senha:"prof123",   nome:"Prof. Carlos Lima", perfil:"professor" },
  { id:3, usuario:"aluno",     senha:"aluno123",  nome:"Maria Souza",       perfil:"aluno", matricula:"2024001", turma:"ES-3A" },
  { id:4, usuario:"joao",      senha:"joao456",   nome:"João Ferreira",     perfil:"aluno", matricula:"2024002", turma:"ES-2B" }
];
var usuarioAtual = null;
// VULNERABILIDADE 2: dados apenas no localStorage
var ocorrencias = JSON.parse(localStorage.getItem("ocorrencias") || "[]");
var logs = JSON.parse(localStorage.getItem("logs") || "[]");
function fazerLogin() {
  var u=document.getElementById("login-usuario").value.trim();
  var s=document.getElementById("login-senha").value.trim();
  document.getElementById("login-erro").style.display="none";
  var encontrado=null;
  for(var i=0;i<usuarios.length;i++){
    if(usuarios[i].usuario===u && usuarios[i].senha===s){
      encontrado=usuarios[i];
      break;
    }
  }
  if(encontrado){
    usuarioAtual=encontrado;
    document.getElementById("tela-login").classList.remove("ativa");
    document.getElementById("tela-principal").classList.add("ativa");
    document.getElementById("info-usuario-logado").textContent=encontrado.nome+" ("+encontrado.perfil+")";
    registrarLog("LOGIN","Usuário "+encontrado.usuario+" fez login");
    renderizarOcorrencias(); renderizarUsuarios(); renderizarLogs();
  } else { document.getElementById("login-erro").style.display="block"; }
}
function fazerLogout(){
  registrarLog("LOGOUT","Usuário "+usuarioAtual.usuario+" fez logout");
  usuarioAtual=null;
  document.getElementById("tela-principal").classList.remove("ativa");
  document.getElementById("tela-login").classList.add("ativa");
  document.getElementById("login-usuario").value="";
  document.getElementById("login-senha").value="";
}
function mostrarAba(id,ev){
  // VULNERABILIDADE 5: sem verificação de permissão por perfil
  document.querySelectorAll(".aba").forEach(function(a){a.classList.remove("ativa");});
  document.getElementById(id).classList.add("ativa");
  document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("ativo");});
  ev.target.classList.add("ativo");
  if(id==="aba-logs") renderizarLogs();
}
function cadastrarOcorrencia(){
  var aluno=document.getElementById("ocorr-aluno").value.trim();
  var cpf=document.getElementById("ocorr-cpf").value.trim();
  var mat=document.getElementById("ocorr-matricula").value.trim();
  var turma=document.getElementById("ocorr-turma").value.trim();
  var tipo=document.getElementById("ocorr-tipo").value;
  var desc=document.getElementById("ocorr-descricao").value.trim();
  var grav=document.getElementById("ocorr-gravidade").value;
  var msg=document.getElementById("cadastro-msg");
  // VULNERABILIDADE 6: validação mínima, CPF não validado
  if(!aluno||!desc){msg.textContent="Preencha ao menos o nome e a descrição.";msg.className="msg-erro";msg.style.display="block";return;}
  var nova={id:Date.now(),aluno:aluno,cpf:cpf,matricula:mat,turma:turma,tipo:tipo,descricao:desc,gravidade:grav,registradoPor:usuarioAtual.usuario,data:new Date().toLocaleString("pt-BR")};
  ocorrencias.push(nova);
  localStorage.setItem("ocorrencias",JSON.stringify(ocorrencias));
  // VULNERABILIDADE 7: CPF nos logs (excesso de dados)
  registrarLog("CADASTRO","Ocorrência para: "+aluno+" | CPF: "+cpf);
  msg.textContent="Ocorrência registrada com sucesso!";msg.className="msg-sucesso";msg.style.display="block";
  renderizarOcorrencias();
}
function renderizarOcorrencias(){
  var lista=document.getElementById("lista-ocorrencias");
  if(!ocorrencias.length){lista.innerHTML="<p style='color:#888'>Nenhuma ocorrência registrada.</p>";return;}
  // VULNERABILIDADE 8: alunos veem TODAS as ocorrências
  lista.innerHTML=ocorrencias.map(function(o){
    return '<div class="card-ocorrencia gravidade-'+o.gravidade+'"><div class="titulo">'+o.aluno+' — '+o.tipo+'</div>'+
      '<div class="detalhe">CPF: '+o.cpf+' | Matrícula: '+o.matricula+' | Turma: '+o.turma+'</div>'+
      '<div class="detalhe">'+o.descricao+'</div>'+
      '<div class="detalhe" style="margin-top:0.4rem">Registrado por: '+o.registradoPor+' | '+o.data+'</div></div>';
  }).join("");
}
function renderizarUsuarios(){
  var lista=document.getElementById("lista-usuarios");
  // VULNERABILIDADE 9: senhas exibidas em texto claro
  lista.innerHTML=usuarios.map(function(u){
    return '<div class="card-usuario"><span class="badge badge-'+u.perfil+'">'+u.perfil.toUpperCase()+'</span>'+
      '<div><strong>'+u.nome+'</strong><br><span style="font-size:0.8rem;color:#888">Login: '+u.usuario+' | Senha: '+u.senha+'</span></div></div>';
  }).join("");
}
function registrarLog(tipo,msg){
  var entrada={tipo:tipo,msg:msg,usuario:usuarioAtual?usuarioAtual.usuario:"sistema",data:new Date().toLocaleString("pt-BR")};
  logs.push(entrada);
  // VULNERABILIDADE 10: logs apenas no localStorage
  localStorage.setItem("logs",JSON.stringify(logs));
}
function renderizarLogs(){
  var lista=document.getElementById("lista-logs");
  if(!logs.length){lista.innerHTML="<p style='color:#888'>Nenhum log registrado.</p>";return;}
  lista.innerHTML=logs.slice().reverse().map(function(l){
    return '<div class="log-item">['+l.data+'] ['+l.tipo+'] '+l.usuario+': '+l.msg+'</div>';
  }).join("");
}
function limparLogs(){
  // VULNERABILIDADE 11: qualquer perfil pode apagar todos os logs
  logs=[];localStorage.setItem("logs",JSON.stringify(logs));renderizarLogs();
}
function exportarDados(){
  // VULNERABILIDADE 12: exporta usuários com senhas
  var dados={ocorrencias:ocorrencias,usuarios:usuarios,logs:logs};
  var blob=new Blob([JSON.stringify(dados,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ocorrencias.json";a.click();
  registrarLog("EXPORTAR","Dados exportados em JSON");
}
function exportarCSV(){
  var linhas=["id,aluno,cpf,matricula,turma,tipo,gravidade,registradoPor,data"];
  ocorrencias.forEach(function(o){linhas.push([o.id,o.aluno,o.cpf,o.matricula,o.turma,o.tipo,o.gravidade,o.registradoPor,o.data].join(","));});
  var blob=new Blob([linhas.join("\n")],{type:"text/csv"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ocorrencias.csv";a.click();
  registrarLog("EXPORTAR","Dados exportados em CSV");
}
</script>
</body>
</html>
